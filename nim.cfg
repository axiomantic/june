--app:console
#--noMain:on
--verbosity:2

warning[UnusedImport] = off

# JUCE module selection and global settings. These are identical on every
# platform, so they live outside the per-platform blocks below; only the
# toolchain flags and the link line differ per platform.
--passC:"-Isources"
--passC:"-IJUCE/modules"
--passC:"-DJUCE_GLOBAL_MODULE_SETTINGS_INCLUDED=1"
--passC:"-DJUCE_STANDALONE_APPLICATION=1"
--passC:"-DJUCE_DISPLAY_SPLASH_SCREEN=0"
--passC:"-DJUCE_WEB_BROWSER=0"
--passC:"-DJUCE_ALLOW_STATIC_NULL_VARIABLES=0"
--passC:"-DJUCE_LOG_ASSERTIONS=1"
--passC:"-DJUCE_STRICT_REFCOUNTEDPOINTER=1"
--passC:"-DJUCE_MODULE_AVAILABLE_juce_analytics=0"
--passC:"-DJUCE_MODULE_AVAILABLE_juce_gui_basics=1"
--passC:"-DJUCE_MODULE_AVAILABLE_juce_graphics=1"
--passC:"-DJUCE_MODULE_AVAILABLE_juce_events=1"
--passC:"-DJUCE_MODULE_AVAILABLE_juce_core=1"
--passC:"-DJUCE_MODULE_AVAILABLE_juce_data_structures=1"
--passC:"-DJUCE_MODULE_AVAILABLE_juce_audio_basics=0"
--passC:"-DJUCE_MODULE_AVAILABLE_juce_audio_devices=0"
--passC:"-DJUCE_MODULE_AVAILABLE_juce_audio_formats=0"
--passC:"-DJUCE_MODULE_AVAILABLE_juce_audio_processors=0"
--passC:"-DJUCE_MODULE_AVAILABLE_juce_gui_extra=0"
--passC:"-DJUCE_MODULE_AVAILABLE_juce_audio_utils=0"
--passC:"-DJUCE_MODULE_AVAILABLE_juce_cryptography=0"
--passC:"-DJUCE_MODULE_AVAILABLE_juce_dsp=0"
--passC:"-DJUCE_MODULE_AVAILABLE_juce_opengl=0"
--passC:"-DJUCE_MODULE_AVAILABLE_juce_osc=0"
--passC:"-DJUCE_MODULE_AVAILABLE_juce_video=0"

@if release or danger:
  --passC:"-std=c++17 -O3 -DNDEBUG=1 -D_NDEBUG=1"
  --passL:"build/june_artefacts/Release/libjune.a"
@else:
  --debugger:native
  --passC:"-std=c++17 -O0 -g -DDEBUG=1 -D_DEBUG=1"
  --passL:"build/june_artefacts/Debug/libjune.a"
@end

@if macosx:
  # Keep the deployment target in step with CMAKE_OSX_DEPLOYMENT_TARGET in the
  # juce_debug / juce_release nimble tasks, or the linker warns about a version
  # mismatch between libjune.a and the Nim objects.
  --passC:"-mmacosx-version-min=11.6"
  --passL:"-mmacosx-version-min=11.6"
  --passL:"-framework Cocoa"
  --passL:"-framework Foundation"
  --passL:"-framework CoreServices"
  --passL:"-framework CoreImage"
  --passL:"-framework AppKit"
  --passL:"-framework QuartzCore"
  --passL:"-framework IOKit"
  --passL:"-framework Security"
  --passL:"-weak_framework Metal"
  --passL:"-weak_framework MetalKit"
@end

@if linux:
  --passC:"-I/usr/include/freetype2"
  --passL:"-lfreetype"
  --passL:"-lfontconfig"
  --passL:"-lX11"
  --passL:"-lXext"
  --passL:"-lXinerama"
  --passL:"-lXrandr"
  --passL:"-lXcursor"
  --passL:"-lXcomposite"
  --passL:"-lcurl"
  --passL:"-lrt"
  --passL:"-ldl"
  --passL:"-lpthread"
@end
